name: Release Module

on:
  push:
    branches: [main]
    paths:
      - 'module.json'
  # Manual run: publishes the current module.json version to the Foundry package listing
  # (useful for a version that is already released on GitHub). Try dry_run first.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Foundry listing: validate only, do not publish'
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Читаем версию из module.json
      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' module.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      # Проверяем, существует ли уже такой тег (на GitHub: checkout@v4 не скачивает теги)
      - name: Check if tag exists
        id: check_tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Создаём zip (укажи свои файлы!)
      - name: Create zip
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          zip -r module.zip \
            module.json \
            scripts/ \
            styles/ \
            templates/ \
            lang/

      # Создаём релиз
      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          artifacts: 'module.json,module.zip'
          token: ${{ secrets.GITHUB_TOKEN }}

      # Публикуем версию в каталоге foundryvtt.com (Package Release API).
      # Нужен секрет FOUNDRY_RELEASE_TOKEN (fvttp_..., из админки пакета на foundryvtt.com).
      # Без секрета шаг пропускается с предупреждением. Манифест указывает на конкретный релиз,
      # а не на main, как требует API.
      - name: Publish to Foundry package listing
        if: steps.check_tag.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$FOUNDRY_RELEASE_TOKEN" ]; then
            echo "::warning::FOUNDRY_RELEASE_TOKEN secret is not set; skipping the Foundry package listing"
            exit 0
          fi
          ID=$(jq -r '.id' module.json)
          VERSION=$(jq -r '.version' module.json)
          TAG="v$VERSION"
          BASE="https://github.com/$REPO/releases"
          MANIFEST="$BASE/download/$TAG/module.json"

          # The listing must point at a manifest that actually exists.
          for i in 1 2 3 4 5 6; do
            curl -sfL -o /dev/null "$MANIFEST" && break
            echo "Waiting for $MANIFEST ..."; sleep 10
          done
          curl -sfL -o /dev/null "$MANIFEST" || { echo "::error::$MANIFEST is not reachable"; exit 1; }

          BODY=$(jq -n \
            --arg id "$ID" --arg version "$VERSION" \
            --arg manifest "$MANIFEST" --arg notes "$BASE/tag/$TAG" \
            --argjson dry "$DRY_RUN" \
            --argjson compat "$(jq '.compatibility // {}' module.json)" \
            '{id: $id, "dry-run": $dry, release: {version: $version, manifest: $manifest, notes: $notes,
              compatibility: {minimum: ($compat.minimum // ""), verified: ($compat.verified // ""), maximum: ($compat.maximum // "")}}}')
          echo "Request (dry-run=$DRY_RUN):"; echo "$BODY"

          for attempt in 1 2; do
            HTTP=$(curl -sS -o response.json -D headers.txt -w '%{http_code}' \
              -X POST https://foundryvtt.com/_api/packages/release_version/ \
              -H "Content-Type: application/json" \
              -H "Authorization: $FOUNDRY_RELEASE_TOKEN" \
              -d "$BODY")
            echo "HTTP $HTTP"; cat response.json; echo
            if [ "$HTTP" = "429" ]; then
              WAIT=$(grep -i '^retry-after:' headers.txt | tr -dc '0-9')
              sleep "${WAIT:-60}"; continue
            fi
            if [ "$HTTP" = "200" ]; then exit 0; fi
            echo "::error::Foundry Package Release API returned HTTP $HTTP"; exit 1
          done
          echo "::error::Foundry Package Release API still rate-limited"; exit 1
